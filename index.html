
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор жизни программиста</title>

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        /* Панель характеристик */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: #292929;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 12px;
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .stat-value {
            font-weight: bold;
        }

        .stat-bar-container {
            height: 8px;
            background-color: #444;
            border-radius: 5px;
            overflow: hidden;
        }

        .stat-bar {
            height: 100%;
            width: 50%;
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .energy-bar {
            background-color: #4caf50;
        }

        .money-bar {
            background-color: #d9ad39;
        }

        .study-bar {
            background-color: #4285d4;
        }

        .reputation-bar {
            background-color: #9b73cf;
        }

        .scene-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            background-color: #2d2d2d;
            color: #ffffff;
            border: 1px solid #444;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: #383838;
            border-color: #4caf50;
        }

        .restart-btn {
            background-color: #4caf50;
            color: #121212;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }

        .restart-btn:hover {
            background-color: #45a049;
        }

        @media (max-width: 450px) {
            .stats-panel {
                grid-template-columns: 1fr;
            }

            .game-container {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="game-container">

    <div class="header">
        <span><strong>Dev Simulator</strong></span>
    </div>

    <!-- Панель характеристик -->
    <div class="stats-panel">

        <div class="stat-card">
            <div class="stat-header">
                <span>⚡ Энергия</span>
                <span class="stat-value" id="energy-text">50%</span>
            </div>
            <div class="stat-bar-container">
                <div class="stat-bar energy-bar" id="energy-bar"></div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-header">
                <span>💰 Деньги</span>
                <span class="stat-value" id="money-text">2500 ₽</span>
            </div>
            <div class="stat-bar-container">
                <div class="stat-bar money-bar" id="money-bar"></div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-header">
                <span>📚 Успеваемость</span>
                <span class="stat-value" id="study-text">50/100</span>
            </div>
            <div class="stat-bar-container">
                <div class="stat-bar study-bar" id="study-bar"></div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-header">
                <span>⭐ Репутация</span>
                <span class="stat-value" id="reputation-text">50/100</span>
            </div>
            <div class="stat-bar-container">
                <div class="stat-bar reputation-bar" id="reputation-bar"></div>
            </div>
        </div>

    </div>

    <div class="scene-text" id="scene-text">
        Загрузка сюжета...
    </div>

    <div class="choices" id="choices"></div>

</div>

<script>
    let story = {};

    // Начальные характеристики
    let energy = 50;
    let money = 2500;
    let study = 50;
    let reputation = 50;

    // Загрузка игры
    async function initGame() {
        try {
            const response = await fetch('story.json');

            if (!response.ok) {
                throw new Error('Не удалось загрузить story.json');
            }

            story = await response.json();

            // Сброс характеристик
            energy = 50;
            money = 2500;
            study = 50;
            reputation = 50;

            updateStats();
            renderScene('start');

        } catch (e) {
            document.getElementById('scene-text').innerText =
                'Ошибка загрузки story.json. Если открываете файл локально, запустите через Live Server или GitHub Pages.';
        }
    }

    // Изменение энергии
    function updateEnergy(change) {
        energy += change;

        if (energy > 100) energy = 100;
        if (energy < 0) energy = 0;

        updateStats();
    }

    // Обновление всех характеристик
    function updateStats() {

        // Энергия
        document.getElementById('energy-text').innerText =
            `Энергия: ${energy}%`;

        const energyBar = document.getElementById('energy-bar');

        energyBar.style.width = energy + '%';

        if (energy > 50) {
            energyBar.style.backgroundColor = '#4caf50';
        } else if (energy > 20) {
            energyBar.style.backgroundColor = '#ff9800';
        } else {
            energyBar.style.backgroundColor = '#f44336';
        }

        // Деньги
        document.getElementById('money-text').innerText =
            money.toLocaleString('ru-RU') + ' ₽';

        document.getElementById('money-bar').style.width =
            Math.min(money / 5000 * 100, 100) + '%';

        // Успеваемость
        document.getElementById('study-text').innerText =
            study + '/100';

        document.getElementById('study-bar').style.width =
            study + '%';

        // Репутация
        document.getElementById('reputation-text').innerText =
            reputation + '/100';

        document.getElementById('reputation-bar').style.width =
            reputation + '%';
    }

    function applyChoice(choice) {
    // Изменяем характеристики
    energy += choice.energy_change || 0;
    money += choice.money_change || 0;
    study += choice.study_change || 0;
    reputation += choice.reputation_change || 0;

    // Ограничиваем значения
    energy = Math.max(0, Math.min(100, energy));
    money = Math.max(0, money);
    study = Math.max(0, Math.min(100, study));
    reputation = Math.max(0, Math.min(100, reputation));

    // Обновляем панель
    updateStats();

    // Переходим к следующей сцене
    renderScene(choice.next_scene);
}
    function getChoiceEffects(choice) {
    const effects = [];

    if (choice.energy_change) {
        effects.push(`⚡ ${choice.energy_change > 0 ? '+' : ''}${choice.energy_change}`);
    }

    if (choice.money_change) {
        effects.push(`💰 ${choice.money_change > 0 ? '+' : ''}${choice.money_change} ₽`);
    }

    if (choice.study_change) {
        effects.push(`📚 ${choice.study_change > 0 ? '+' : ''}${choice.study_change}`);
    }

    if (choice.reputation_change) {
        effects.push(`⭐ ${choice.reputation_change > 0 ? '+' : ''}${choice.reputation_change}`);
    }

    return effects.length > 0
        ? ` (${effects.join(' · ')})`
        : '';
}

    // Отображение игровой сцены
    function renderScene(sceneId) {
        const textEl = document.getElementById('scene-text');
        const choicesEl = document.getElementById('choices');

        choicesEl.innerHTML = '';

        if (energy <= 0) {
            textEl.innerText =
                'Ты уснул прямо лицом на клавиатуре. Сон победил.';

            addRestartButton(choicesEl);
            return;
        }

        const scene = story[sceneId];

        if (!scene) {
            textEl.innerText =
                'Сцена не найдена! Пора сделать новый коммит и дописать её в story.json.';

            addRestartButton(choicesEl);
            return;
        }

        textEl.innerText = scene.text;

        if (!scene.choices || scene.choices.length === 0) {
            addRestartButton(choicesEl);
            return;
        }

        scene.choices.forEach(choice => {
            const btn = document.createElement('button');

            btn.innerText = choice.text + getChoiceEffects(choice);

            btn.onclick = () => {
                applyChoice(choice);
            };

            choicesEl.appendChild(btn);
        });
    }

    // Кнопка перезапуска
    function addRestartButton(container) {
        const btn = document.createElement('button');

        btn.className = 'restart-btn';
        btn.innerText = 'Начать день заново';
        btn.onclick = initGame;

        container.appendChild(btn);
    }

    // Запуск игры
    initGame();

</script>

</body>
</html>
